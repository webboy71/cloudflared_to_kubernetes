apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: me-ingress
  #namespace: me-ns
spec:
  ingressClassName: nginx
  rules:
  #- host: mong.fi-hiqpublic.cftenant.com 
  - http:
      paths:
      - path: /
        pathType: Prefix  
        backend:
          service:
            name: mongo-express-service
            port: 
              number: 8081